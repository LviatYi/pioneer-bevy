[package]
name = "pioneer-bevy"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.19.0"
anyhow = "1.0.103"
mcubes = "0.1.7"
noise = "0.9.0"
ron = "0.12.2"
thiserror = "2.0.18"
serde = { version = "1.0.228", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.dev]
opt-level = 0
